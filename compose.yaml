name: traceweaver
include:
  - compose.dev.yaml

x-api: &api
  image: traceweaver-api:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=16m,mode=1777
  environment:
    APP_ENV: ${APP_ENV:-development}
    DATABASE_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    CURSOR_SECRET: ${CURSOR_SECRET:?Set CURSOR_SECRET in .env}
    DB_POOL_MAX: ${DB_POOL_MAX:-5}
    OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/traceweaver}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-traceweaver-web}
    INGEST_CLIENT_ID: ${INGEST_CLIENT_ID:-traceweaver-ingest}
    OIDC_API_AUDIENCE: ${OIDC_API_AUDIENCE:-traceweaver-api}
    OIDC_JWKS_URI: ${OIDC_JWKS_URI:-${OIDC_ISSUER:-http://localhost:8081/realms/traceweaver}/protocol/openid-connect/certs}
    OIDC_TIMEOUT_MS: ${OIDC_TIMEOUT_MS:-2000}
    SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}

services:
  migrate:
    <<: *api
    command: [node, --import, ./scripts/container-env.js, scripts/migrate.js]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 65s
    restart: unless-stopped
