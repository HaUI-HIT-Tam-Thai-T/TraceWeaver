name: traceweaver
include:
  - compose.dev.yaml

x-api: &api
  image: traceweaver-api:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=16m,mode=1777
  environment:
    APP_ENV: ${APP_ENV:-development}
    DATABASE_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    CURSOR_SECRET: ${CURSOR_SECRET:?Set CURSOR_SECRET in .env}
    LAB_INGEST_SUBJECT: ${LAB_INGEST_SUBJECT:-}
    DB_POOL_MAX: ${DB_POOL_MAX:-5}
    FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    FRONTEND_ORIGINS: ${FRONTEND_ORIGINS-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
    OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/traceweaver}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-traceweaver-web}
    INGEST_CLIENT_ID: ${INGEST_CLIENT_ID:-traceweaver-ingest}
    CORE_APP_CLIENT_ID: ${CORE_APP_CLIENT_ID:-traceweaver-core}
    CORE_APP_SUBJECT: ${CORE_APP_SUBJECT:-}
    OIDC_API_AUDIENCE: ${OIDC_API_AUDIENCE:-traceweaver-api}
    OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/traceweaver/protocol/openid-connect/certs}
    OIDC_LOCAL_KEYCLOAK: "true"
    OIDC_TIMEOUT_MS: ${OIDC_TIMEOUT_MS:-2000}
    SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: [start-dev, --import-realm]
    env_file: .env.keycloak.local
    environment:
      KC_HOSTNAME: http://localhost:${IDENTITY_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8081}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./.local/keycloak/traceweaver-realm.json:/opt/keycloak/data/import/traceweaver-realm.json:ro
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *200* ]]"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  migrate:
    <<: *api
    command: [node, --import, ./scripts/container-env.js, scripts/migrate.js]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    stop_grace_period: 65s
    restart: unless-stopped

volumes:
  keycloak_data:
