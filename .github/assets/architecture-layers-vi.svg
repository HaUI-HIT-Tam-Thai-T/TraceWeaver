<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" role="img" aria-labelledby="title desc" lang="vi">
<title id="title">Kiến trúc ba tầng — TraceWeaver</title>
<desc id="desc">Open-Core: Identity, Data, Reconstruction, Workflow, Audit. H-P-D-I: Human, Process, Data, Intelligence. TraceWeaver: Web, API, Sandbox.</desc>
