name: Project base CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
      - run: npm run sbom:check

  ai-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: '.venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: -r ai/requirements.txt'
      - run: .venv/bin/python -m ai.scripts.dependency_inventory --check

  frontend-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm run licenses:frontend:check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:be:check
      - run: npm run format:sim:check
      - run: npm run check:base
      - run: npm run licenses:check
      - run: npm test
      - run: npm run test:sim

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:setup
      - run: docker compose -f compose.dev.yaml pull postgres
      - run: npm run db:up
      - run: npm run db:migrate
      - run: npm run smoke
      - run: npm run test:db
      - run: npm run test:identity:native
      - run: npm audit --omit=dev --audit-level=moderate
      - if: always()
        run: npm run db:stop
