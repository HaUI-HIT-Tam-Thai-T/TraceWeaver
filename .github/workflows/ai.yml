name: AI scorer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scorer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: python -m pip install --only-binary=:all: -r ai/requirements.txt
      - run: python -m pip check
      - run: python -m ai.scripts.dependency_inventory --check
      - run: python -m unittest discover -s ai/tests -p "test_*.py" -v
      - run: python -m ai.scripts.smoke
