name: AI scorer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scorer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: 'python -m pip install --only-binary=:all: -r ai/requirements.txt'
      - run: python -m pip check
      - run: python -m ai.scripts.dependency_inventory --check
      - run: python -m unittest discover -s ai/tests -p "test_*.py" -v
      - run: python -m ai.scripts.smoke
      - run: python -m ai.scripts.smoke_model
      - run: python -m ai.scripts.export_feature_handoff
      - run: python .local/ai-be-feature-handoff/check_features.py
